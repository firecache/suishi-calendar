<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>岁时历 · 设计原型</title>
<style>
  :root{
    --ink:#1F1B16; --ink-soft:#5C554B; --muted:#948B7E;
    --paper:#FAF7F2; --surface:#FFFFFF; --border:#E7E0D4;
    --vermilion:#C03A2B; --vermilion-soft:#F7E4E0;
    --jade:#4A7C59; --gold:#A9801F;
    --cold:#3B7CB8; --hot:#C0392B;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    background:#EDE8E0;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","MiSans","Microsoft YaHei",sans-serif;
    color:var(--ink);
    min-height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:24px;
  }
  .page-head{text-align:center; margin-bottom:18px;}
  .page-head h1{font-size:20px; font-weight:600; margin:0 0 4px; letter-spacing:.02em;}
  .page-head p{margin:0; font-size:13px; color:var(--ink-soft);}

  .stage{display:flex; gap:28px; align-items:flex-start; flex-wrap:wrap; justify-content:center;}

  /* ===== 手机框 ===== */
  .phone{
    width:390px; height:780px; background:var(--paper);
    border:1px solid #D8D0C2; border-radius:40px;
    box-shadow:0 30px 60px rgba(31,27,22,.18);
    display:flex; flex-direction:column; overflow:hidden; position:relative;
  }
  .statusbar{
    height:44px; flex:0 0 44px; display:flex; align-items:center; justify-content:space-between;
    padding:0 22px; font-size:13px; font-weight:600; color:var(--ink);
  }
  .notch{position:absolute; top:8px; left:50%; transform:translateX(-50%); width:120px; height:26px; background:#1F1B16; border-radius:14px;}

  .screens{flex:1; position:relative; overflow:hidden;}
  .screen{position:absolute; inset:0; overflow-y:auto; padding:0 16px 16px; display:none; scrollbar-width:none;}
  .screen.active{display:block;}
  .screen::-webkit-scrollbar{display:none;}

  /* ===== 月历 ===== */
  .cal-head{display:flex; align-items:flex-end; justify-content:space-between; padding:14px 4px 12px;}
  .cal-head .ym{cursor:pointer;}
  .cal-head .ym h2{margin:0; font-size:26px; font-weight:700; letter-spacing:.01em; font-variant-numeric:tabular-nums;}
  .cal-head .ym .ym-caret{margin-left:6px; font-size:14px; color:var(--muted); font-weight:600;}
  .cal-head .ym .lunar-year{margin-top:2px; font-size:13px; color:var(--ink-soft);}
  .cal-head .nav{display:flex; gap:8px;}
  .cal-head .nav button{
    width:34px; height:34px; border-radius:50%; border:1px solid var(--border); background:var(--surface);
    color:var(--ink); font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:background .15s;
  }
  .cal-head .nav button:hover{background:var(--vermilion-soft);}
  .cal-head .nav .today-btn{
    width:auto; height:34px; padding:0 14px; border-radius:17px; border:none; background:var(--vermilion);
    color:#fff; font-size:14px; font-weight:600; cursor:pointer;
  }
  .cal-head .nav .today-btn:active{filter:brightness(.92);}

  .week-row{display:grid; grid-template-columns:repeat(7,1fr); padding:4px 0 8px;}
  .week-row span{text-align:center; font-size:12px; color:var(--muted); font-weight:500;}
  .week-row span.weekend{color:var(--vermilion);}

  .grid{display:grid; grid-template-columns:repeat(7,1fr); border-top:1px solid var(--border); border-left:1px solid var(--border); border-radius:12px; overflow:hidden;}
  .cell{
    aspect-ratio:1/0.98; box-sizing:border-box; cursor:pointer; position:relative;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
    padding-top:5px; transition:background .12s, transform .12s;
    border-right:1px solid var(--border); border-bottom:1px solid var(--border);
  }
  .cell:active{transform:scale(.96);}
  .cell .solar{font-size:17px; font-weight:600; font-variant-numeric:tabular-nums; line-height:1.1;}
  .cell .lunar{font-size:10px; color:var(--muted); margin-top:2px; line-height:1.2;}
  .cell .mark{font-size:10px; margin-top:2px; font-weight:600; line-height:1.2; white-space:nowrap;}
  .cell .mark.term{color:var(--jade);}
  .cell .mark.fest{color:var(--gold);}
  .cell .holiday{position:absolute; top:3px; right:4px; font-size:9px; font-weight:600; line-height:1;}
  .cell .holiday.rest{color:var(--vermilion);}
  .cell .holiday.work{color:var(--muted);}
  .cell.dim .solar{color:var(--muted); font-weight:500;}
  .cell.dim .lunar{color:#C6BEB2;}
  .cell.today{background:var(--vermilion);}
  .cell.today .solar,.cell.today .lunar,.cell.today .mark{color:#fff;}
  .cell.today .mark.term,.cell.today .mark.fest{color:#FFE3DB;}
  .cell.today .holiday{color:#FFE3DB;}
  .cell.selected:not(.today){background:var(--vermilion-soft); outline:1.5px solid var(--vermilion);}
  .cell.selected:not(.today) .solar{color:var(--vermilion);}
  .cell:hover:not(.today){background:var(--paper);}

  /* 年月选择浮层 */
  .ym-picker{position:absolute; inset:0; z-index:20; background:var(--paper); display:none; flex-direction:column; padding:20px 16px; box-sizing:border-box;}
  .ym-picker.open{display:flex;}
  .ym-picker .ymp-head{display:flex; align-items:center; justify-content:center; gap:16px; margin-bottom:18px;}
  .ym-picker .ymp-head button{width:40px; height:40px; border-radius:50%; border:1px solid var(--border); background:var(--surface); color:var(--ink); font-size:20px; cursor:pointer;}
  .ym-picker .ymp-year{font-size:22px; font-weight:700; min-width:90px; text-align:center; font-variant-numeric:tabular-nums;}
  .ym-picker .ymp-months{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
  .ym-picker .ymp-months button{padding:16px 0; border:1px solid var(--border); border-radius:12px; background:var(--surface); color:var(--ink); font-size:16px; cursor:pointer;}
  .ym-picker .ymp-months button.cur{background:var(--vermilion); color:#fff; border-color:var(--vermilion);}
  .ym-picker .ymp-months button:hover{background:var(--vermilion-soft);}
  .ym-picker .ymp-close{align-self:center; margin-top:18px; padding:10px 34px; border:1px solid var(--border); background:var(--surface); color:var(--ink-soft); border-radius:24px; font-size:15px; cursor:pointer;}

  /* 天气页 */
  .cal-head .nav button.gear{font-size:15px;}
  .w-head{display:flex; align-items:center; justify-content:space-between; padding:14px 4px 4px;}
  .w-head .w-city{font-size:20px; font-weight:700;}
  .w-head .w-gear{font-size:20px; color:var(--muted); cursor:pointer; padding:0 4px;}
  .w-hero{display:flex; flex-direction:column; align-items:center; padding:12px 0 4px;}
  .w-hero-icon{font-size:64px; line-height:1;}
  .w-hero-temp{font-size:72px; font-weight:600; line-height:1.05; font-family:"Iowan Old Style","Songti SC","Noto Serif SC",serif; font-variant-numeric:tabular-nums;}
  .w-hero-desc{font-size:15px; color:var(--ink-soft); margin-top:6px;}
  .w-metrics{display:flex; margin-top:14px; border:1px solid var(--border); border-radius:12px; background:var(--surface); overflow:hidden;}
  .w-metric{flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; padding:12px 0;}
  .w-metric + .w-metric{border-left:1px solid var(--border);}
  .w-m-label{font-size:11px; color:var(--muted);}
  .w-m-val{font-size:13px; font-weight:600; color:var(--ink);}
  .sec-title{font-size:13px; color:var(--muted); margin:18px 4px 8px; font-weight:600; letter-spacing:.05em;}
  .f-row{display:flex; align-items:center; gap:12px; padding:12px 14px; background:var(--surface); border-bottom:1px solid var(--border);}
  .f-row:first-child{border-radius:16px 16px 0 0;}
  .f-row:last-child{border-radius:0 0 16px 16px; border-bottom:none;}
  .f-day{width:60px; display:flex; flex-direction:column;}
  .f-week{font-size:13px; font-weight:600; color:var(--ink);}
  .f-date{font-size:11px; color:var(--muted); margin-top:1px;}
  .f-icon{font-size:22px; width:30px; text-align:center;}
  .f-mid{flex:1; display:flex; flex-direction:column; gap:2px;}
  .f-text{font-size:13px; color:var(--ink); font-weight:500;}
  .f-meta{font-size:11px; color:var(--ink-soft);}
  .f-temp{display:flex; align-items:baseline; gap:4px; font-weight:600; font-size:13px; font-variant-numeric:tabular-nums;}
  .f-temp .lo{color:var(--cold);}
  .f-temp .hi{color:var(--hot);}
  .f-temp .slash{color:var(--muted); font-weight:400;}

  /* 天气卡 */
  .weather-card{
    margin-top:14px; border:1px solid var(--border); border-radius:16px; background:var(--surface);
    padding:14px 16px; display:flex; align-items:center; gap:16px; cursor:pointer;
  }
  .weather-card .w-temp{font-size:40px; font-weight:600; font-variant-numeric:tabular-nums; font-family:"Iowan Old Style","Songti SC","Noto Serif SC",serif; line-height:1;}
  .weather-card .w-temp sup{font-size:18px; font-weight:500;}
  .weather-card .w-icon{font-size:34px; line-height:1;}
  .weather-card .w-info{flex:1; display:flex; flex-direction:column; gap:3px;}
  .weather-card .w-desc{font-size:15px; font-weight:600;}
  .weather-card .w-meta{font-size:12px; color:var(--ink-soft); display:flex; flex-wrap:wrap; gap:2px 10px;}
  .weather-card .w-city{font-size:12px; color:var(--muted);}

  /* ===== 日详情 ===== */
  .day-hero{text-align:center; padding:26px 0 6px;}
  .day-hero .big{font-size:72px; font-weight:600; line-height:1; font-family:"Iowan Old Style","Songti SC","Noto Serif SC",serif; font-variant-numeric:tabular-nums;}
  .day-hero .date-line{margin-top:8px; font-size:14px; color:var(--ink-soft);}
  .day-hero .lunar-line{margin-top:6px; font-size:20px; font-weight:600;}
  .day-hero .lunar-line .tag{font-size:12px; font-weight:600; padding:2px 8px; border-radius:10px; margin-left:6px; vertical-align:2px;}
  .day-hero .lunar-line .tag.term{color:var(--jade); background:rgba(74,124,89,.12);}
  .day-hero .lunar-line .tag.fest{color:var(--gold); background:rgba(169,128,31,.12);}
  .day-hero .lunar-line .tag.rest{color:var(--vermilion); background:rgba(192,58,43,.12);}
  .day-hero .lunar-line .tag.work{color:var(--muted); background:rgba(148,139,126,.16);}
  .gz-row{display:flex; justify-content:center; gap:8px; margin-top:12px; flex-wrap:wrap;}
  .gz-row .chip{font-size:12px; color:var(--ink-soft); border:1px solid var(--border); border-radius:14px; padding:4px 10px; background:var(--surface);}
  .gz-row .chip b{color:var(--ink); font-weight:600;}

  .day-sec-title{font-size:13px; color:var(--muted); margin:20px 4px 8px; font-weight:600; letter-spacing:.05em;}
  .forecast{display:flex; flex-direction:column; gap:0;}
  .forecast .row{
    display:flex; align-items:center; gap:12px; padding:11px 14px; background:var(--surface);
    border-bottom:1px solid var(--border);
  }
  .forecast .row:first-child{border-radius:16px 16px 0 0;}
  .forecast .row:last-child{border-radius:0 0 16px 16px; border-bottom:none;}
  .forecast .row .fd{width:52px; font-size:13px; color:var(--ink-soft); font-weight:500;}
  .forecast .row .fi{font-size:20px; width:26px;}
  .forecast .row .fd-desc{flex:1; font-size:13px; color:var(--ink-soft);}
  .forecast .row .ft{font-variant-numeric:tabular-nums; font-weight:600; font-size:13px;}
  .forecast .row .ft .lo{color:var(--cold);}
  .forecast .row .ft .hi{color:var(--hot);}

  .back-btn{display:inline-flex; align-items:center; gap:4px; margin:4px 0 0 4px; padding:6px 12px;
    border:1px solid var(--border); background:var(--surface); border-radius:16px; font-size:13px; color:var(--ink-soft); cursor:pointer;}
  .back-btn:hover{background:var(--vermilion-soft);}

  /* ===== 设置 ===== */
  .set-group{margin-top:18px;}
  .set-group .set-title{font-size:12px; color:var(--muted); margin:0 6px 6px; font-weight:600; letter-spacing:.05em;}
  .set-list{background:var(--surface); border:1px solid var(--border); border-radius:16px; overflow:hidden;}
  .set-item{display:flex; align-items:center; justify-content:space-between; padding:15px 16px; border-bottom:1px solid var(--border); font-size:15px; cursor:pointer;}
  .set-item:last-child{border-bottom:none;}
  .set-item .val{color:var(--muted); font-size:14px;}
  .set-item .chev{color:#C6BEB2;}
  .set-item:hover{background:var(--paper);}

  /* ===== Tab bar ===== */
  .tabbar{flex:0 0 62px; display:flex; border-top:1px solid var(--border); background:var(--surface);}
  .tab{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; cursor:pointer; color:var(--muted); font-size:11px;}
  .tab .ico{font-size:20px; line-height:1;}
  .tab.active{color:var(--vermilion);}

  /* ===== 设计令牌面板 ===== */
  .tokens{
    width:250px; background:var(--surface); border:1px solid var(--border); border-radius:16px;
    padding:18px; display:flex; flex-direction:column; gap:16px;
  }
  .tokens h3{margin:0; font-size:13px; color:var(--ink-soft); font-weight:600; letter-spacing:.05em;}
  .swatch{display:flex; align-items:center; gap:8px;}
  .swatch .dot{width:26px; height:26px; border-radius:8px; border:1px solid var(--border); flex:0 0 26px;}
  .swatch .lab{font-size:12px; color:var(--ink-soft); line-height:1.25;}
  .swatch .hex{margin-left:auto; font-size:11px; color:var(--muted); font-family:ui-monospace,monospace;}
  .tokens .rule{height:1px; background:var(--border); border:none;}

  @media (max-width:720px){
    .tokens{display:none;}
    .phone{width:100%; max-width:390px;}
  }
</style>
</head>
<body>
  <div class="page-head">
    <h1>岁时历 · Suishi Calendar</h1>
    <p>日历 + 农历 + 节气 + 天气 · 设计原型（点击日期查看详情，左右切换月份）</p>
  </div>

  <div class="stage">
    <div class="phone">
      <div class="statusbar"><span>9:41</span><span class="notch"></span><span>▮▮▮ ▮</span></div>
      <div class="screens">
        <!-- 月历 -->
        <div class="screen active" id="screen-cal"></div>
        <!-- 天气 -->
        <div class="screen" id="screen-weather"></div>
        <!-- 日详情 -->
        <div class="screen" id="screen-day"></div>
        <!-- 设置 -->
        <div class="screen" id="screen-set"></div>
      </div>
      <div class="tabbar">
        <div class="tab active" data-screen="cal"><span class="ico">▦</span>日历</div>
        <div class="tab" data-screen="weather"><span class="ico">☀</span>天气</div>
      </div>
    </div>

    <aside class="tokens">
      <h3>设计令牌 / Design Tokens</h3>
      <div class="swatch"><span class="dot" style="background:#1F1B16"></span><span class="lab">墨 ink · 主文字</span><span class="hex">#1F1B16</span></div>
      <div class="swatch"><span class="dot" style="background:#5C554B"></span><span class="lab">软墨 · 次文字</span><span class="hex">#5C554B</span></div>
      <div class="swatch"><span class="dot" style="background:#FAF7F2"></span><span class="lab">纸 paper · 背景</span><span class="hex">#FAF7F2</span></div>
      <div class="swatch"><span class="dot" style="background:#FFFFFF"></span><span class="lab">面 surface · 卡片</span><span class="hex">#FFFFFF</span></div>
      <div class="swatch"><span class="dot" style="background:#C03A2B"></span><span class="lab">朱砂 · 唯一动作色</span><span class="hex">#C03A2B</span></div>
      <div class="swatch"><span class="dot" style="background:#4A7C59"></span><span class="lab">青玉 · 节气</span><span class="hex">#4A7C59</span></div>
      <div class="swatch"><span class="dot" style="background:#A9801F"></span><span class="lab">鎏金 · 节日</span><span class="hex">#A9801F</span></div>
      <hr class="rule">
      <h3>层级规则</h3>
      <div class="swatch"><span class="lab">数字大而清 → 农历 10px 注于下 → 节气/节日用色角标；卡片 1px 描边无投影</span></div>
    </aside>
  </div>

  <script>
  /*!
   * lunar.js — 农历/干支/生肖/节气/节日 纯本地计算（1900–2100）
   * 无依赖，可在浏览器 / Node / uni-app 中直接使用（ESM）。
   * 算法为公开通用的农历算法，不依赖网络。
   */
    // 1900–2100 农历数据表（闰月 + 大小月编码）
    var lunarInfo = [
      0x04bd8,0x04ae0,0x0a570,0x054d5,0x0d260,0x0d950,0x16554,0x056a0,0x09ad0,0x055d2, //1900-1909

      0x04970,0x0a4b0,0x0b4b5,0x06a50,0x06d40,0x1ab54,0x02b60,0x09570,0x052f2,0x04970, //1920-1929

      0x06ca0,0x0b550,0x15355,0x04da0,0x0a5b0,0x14573,0x052b0,0x0a9a8,0x0e950,0x06aa0, //1950-1959
      0x0aea6,0x0ab50,0x04b60,0x0aae4,0x0a570,0x05260,0x0f263,0x0d950,0x05b57,0x056a0, //1960-1969
      0x096d0,0x04dd5,0x04ad0,0x0a4d0,0x0d4d4,0x0d250,0x0d558,0x0b540,0x0b5a0,0x195a6, //1970-1979
      0x095b0,0x049b0,0x0a974,0x0a4b0,0x0b27a,0x06a50,0x06d40,0x0af46,0x0ab60,0x09570, //1980-1989
      0x04af5,0x04970,0x064b0,0x074a3,0x0ea50,0x06b58,0x05ac0,0x0ab60,0x096d5,0x092e0, //1990-1999
      0x0c960,0x0d954,0x0d4a0,0x0da50,0x07552,0x056a0,0x0abb7,0x025d0,0x092d0,0x0cab5, //2000-2009
      0x0a950,0x0b4a0,0x0baa4,0x0ad50,0x055d9,0x04ba0,0x0a5b0,0x15176,0x052b0,0x0a930, //2010-2019
      0x07954,0x06aa0,0x0ad50,0x05b52,0x04b60,0x0a6e6,0x0a4e0,0x0d260,0x0ea65,0x0d530, //2020-2029
      0x05aa0,0x076a3,0x096d0,0x04afb,0x04ad0,0x0a4d0,0x1d0b6,0x0d250,0x0d520,0x0dd45, //2030-2039
      0x0b5a0,0x056d0,0x055b2,0x049b0,0x0a577,0x0a4b0,0x0aa50,0x1b255,0x06d20,0x0ada0, //2040-2049
      0x14b63,0x09370,0x049f8,0x04970,0x064b0,0x168a6,0x0ea50,0x06b20,0x1a6c4,0x0aae0, //2050-2059
      0x0a2e0,0x0d2e3,0x0c960,0x0d557,0x0d4a0,0x0da50,0x05d55,0x056a0,0x0a6d0,0x055d4, //2060-2069
      0x052d0,0x0a9b8,0x0a950,0x0b4a0,0x0b6a6,0x0ad50,0x055a0,0x0aba4,0x0a5b0,0x052b0, //2070-2079
      0x0b273,0x06930,0x07337,0x06aa0,0x0ad50,0x14b55,0x04b60,0x0a570,0x054e4,0x0d160, //2080-2089
      0x0e968,0x0d520,0x0daa0,0x16aa6,0x056d0,0x04ae0,0x0a9d4,0x0a2d0,0x0d150,0x0f252, //2090-2099
      0x0d520 //2100
    ];
  
    var GAN = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
    var ZHI = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
    var ZODIAC = ['鼠','牛','虎','兔','龙','蛇','马','羊','猴','鸡','狗','猪'];

      var hType = getHolidayType(y,m,d);
      var holidayTag = hType==='rest' ? '<span class="tag rest">休</span>' : (hType==='work' ? '<span class="tag work">班</span>' : '');
      var gz = info.supported ?
        '<div class="chip"><b>'+info.yearGanZhi+'年</b></div>'+
        '<div class="chip">'+info.monthGanZhi+'月</div>'+
        '<div class="chip">'+info.dayGanZhi+'日</div>'+
        '<div class="chip">属<b>'+info.zodiac+'</b></div>'
        : '';

      var w = mockWeather(y,m,d);
      var fcHtml='';
      for(var i=0;i<7;i++){
        var dd = new Date(y,m-1,d+i);
        var fw = mockWeather(dd.getFullYear(),dd.getMonth()+1,dd.getDate());
        var fdLabel = i===0?'今天':(WEEK[(dd.getDay()-state.weekStart+7)%7]);
        fcHtml += '<div class="row"><span class="fd">'+fdLabel+' '+dd.getDate()+'</span>'+
          '<span class="fi">'+fw.icon+'</span>'+
          '<span class="fd-desc">'+fw.kind+'</span>'+
          '<span class="ft"><span class="lo">'+fw.lo+'°</span> / <span class="hi">'+fw.hi+'°</span></span></div>';
      }

      el.innerHTML =
        '<button class="back-btn" id="back-cal">‹ 返回月历</button>'+
        '<div class="day-hero">'+
          '<div class="big">'+d+'</div>'+
          '<div class="date-line">'+y+'年'+m+'月'+d+'日 · '+wd+'</div>'+
          '<div class="lunar-line">'+lunarLine+tag+holidayTag+'</div>'+
          '<div class="gz-row">'+gz+'</div>'+
        '</div>'+
        '<div class="weather-card">'+
          '<span class="w-icon">'+w.icon+'</span>'+
          '<span class="w-temp">'+w.hi+'<sup>°</sup></span>'+
          '<div class="w-info">'+
            '<span class="w-desc">'+w.kind+' · '+w.lo+'°~'+w.hi+'°</span>'+
            '<span class="w-meta">体感'+w.feels+'° · 湿度'+w.humidity+'% · '+w.wind+' · 空气'+w.aqiTxt+'</span>'+
          '</div>'+
        '</div>'+
        '<div class="day-sec-title">7 日天气预报</div>'+
        '<div class="forecast">'+fcHtml+'</div>';
      var b = el.querySelector('#back-cal');
      if(b) b.onclick=function(){ switchScreen('cal'); };
    }

    // ---- 设置渲染 ----
    function renderSet(){
      var el = document.getElementById('screen-set');
      el.innerHTML =
        '<button class="back-btn" id="back-set">‹ 返回</button>'+
        '<div class="set-group"><div class="set-title">通用</div><div class="set-list">'+
          '<div class="set-item"><span>城市</span><span class="val">杭州 ›</span></div>'+
          '<div class="set-item"><span>天气数据源</span><span class="val">演示模式 ›</span></div>'+
          '<div class="set-item"><span>周起始日</span><span class="val">周一 ›</span></div>'+
          '<div class="set-item"><span>主题</span><span class="val">跟随系统 ›</span></div>'+
        '</div></div>'+
        '<div class="set-group"><div class="set-title">关于</div><div class="set-list">'+
          '<div class="set-item"><span>版本</span><span class="val">1.0.0</span></div>'+
          '<div class="set-item"><span>隐私政策</span><span class="chev">›</span></div>'+
        '</div></div>';
      var bs = el.querySelector('#back-set');
      if(bs) bs.onclick=function(){ switchScreen('cal'); };
    }

    function switchScreen(name){
      state.screen = name;
      document.querySelectorAll('.screen').forEach(function(s){ s.classList.remove('active'); });
      document.getElementById('screen-'+name).classList.add('active');
      document.querySelectorAll('.tab').forEach(function(t){ t.classList.toggle('active', t.getAttribute('data-screen')===name); });
      if(name==='day') renderDay();
      if(name==='weather') renderWeather();
      if(name==='set') renderSet();
    }
    document.querySelectorAll('.tab').forEach(function(t){
      t.onclick=function(){ switchScreen(t.getAttribute('data-screen')); };
    });

    // 触摸左右滑动切换 日历↔天气
    var touchX=null;
    var screensEl = document.querySelector('.screens');
    screensEl.addEventListener('touchstart',function(e){touchX=e.touches[0].clientX;}, {passive:true});
    screensEl.addEventListener('touchend',function(e){
      if(touchX===null) return;
      var dx = e.changedTouches[0].clientX - touchX;
      touchX=null;
      if(Math.abs(dx)<50) return;
      if(state.screen==='cal' && dx<0) switchScreen('weather');
      else if(state.screen==='weather' && dx>0) switchScreen('cal');
    }, {passive:true});

    renderCal();
    renderWeather();
    renderDay();
    renderSet();
  })();
  </script>
</body>
</html>
